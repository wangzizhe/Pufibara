name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  public-test-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile public Python sources
        run: python -m compileall gateforge tests scripts
      - name: Run public unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Guard the public tree against internal markers
        run: |
          pattern='assets''_private|CHANGELOG''_INTERNAL|CLEAN''_SOURCE''_BACKED|BENCHMARK''_LEDGER|internal''_docs|task_[0-9]{3,}'
          if git grep -n -E "$pattern" -- . ':!.github/workflows/ci.yml' ':!.gitignore'; then
            echo "Internal marker found in public tree"
            exit 1
          fi
