name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public website
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p _site/assets/fonts
          cp website/index.html website/thanks.html website/styles.css website/pilot-form.js website/demo-video.js website/page-motion.js website/theme.js _site/
          cp website/assets/pufibara.webp website/assets/pufibara-dark.jpg website/assets/mascot-topper.svg _site/assets/
          cp website/assets/fonts/Montserrat-Variable.woff2 website/assets/fonts/OFL-Montserrat.txt _site/assets/fonts/
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
